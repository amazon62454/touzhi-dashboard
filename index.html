<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>基金定投SOP V2 - 规则展示</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- 首页：执行节奏总览 -->
        <div class="page" id="page-home">
            <h1>基金定投SOP V2</h1>
            <div class="card">
                <h2>SOP概览（直接读取SOP.md）</h2>
                <div id="schedule-overview"></div>
            </div>
            <div class="card">
                <h2>版本记录</h2>
                <div id="action-matrix"></div>
            </div>
        </div>
        <!-- 规则页：19章规则展示 -->
        <div class="page" id="page-rules">
            <h1>SOP规则</h1>
            <div class="card">
                <h2>规则目录</h2>
                <div id="rules-catalog"></div>
            </div>
            <div class="card" id="rule-detail-card" style="display:none;">
                <h2 id="rule-detail-title"></h2>
                <div id="rule-detail-content"></div>
            </div>
        </div>
        <!-- 数据页：台账数据展示 -->
        <div class="page" id="page-data">
            <h1>台账数据</h1>
            <div class="card">
                <h2>基金配置</h2>
                <div id="fund-config"></div>
            </div>
            <div class="card">
                <h2>预算参数</h2>
                <div id="budget-params"></div>
            </div>
            <div class="card">
                <h2>规则参数</h2>
                <div id="rule-params"></div>
            </div>
        </div>
        <!-- 判决页：引擎判决展示 -->
        <div class="page" id="page-judgment">
            <h1>引擎判决</h1>
            <div class="card">
                <h2>判决结果</h2>
                <div id="judgment-result"></div>
            </div>
            <div class="card">
                <h2>数据质量</h2>
                <div id="data-quality"></div>
            </div>
        </div>
        <!-- 报告页：五档报告展示 -->
        <div class="page" id="page-report">
            <h1>五档报告</h1>
            <div class="card">
                <h2>报告列表</h2>
                <div id="report-list"></div>
            </div>
            <div class="card" id="report-detail-card" style="display:none;">
                <h2 id="report-detail-title"></h2>
                <div id="report-detail-content"></div>
            </div>
        </div>
        <!-- 导航栏 -->
        <nav class="nav">
            <a href="#page-home" class="nav-item active">首页</a>
            <a href="#page-rules" class="nav-item">规则</a>
            <a href="#page-data" class="nav-item">数据</a>
            <a href="#page-judgment" class="nav-item">判决</a>
            <a href="#page-report" class="nav-item">报告</a>
        </nav>
    </div>
    <script src="app.js"></script>
</body>
</html>
